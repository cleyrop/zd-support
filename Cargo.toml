[package]
name = "zd-support"
version = "0.3.6"
edition = "2024"
rust-version = "1.90"
description = "Zendesk Requests CLI for support tickets and public conversations"
license = "MIT"
repository = "https://github.com/cleyrop/zd-support"
homepage = "https://github.com/cleyrop/zd-support"
readme = "README.md"
publish = false
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = { version = "7", default-features = false }
terminal_size = "0.4"
unicode-width = "0.2"
directories = "6"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "fat"
opt-level = "z"
codegen-units = 1
